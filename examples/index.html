<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TALA layout examples for Mermaid</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182230;
        background: #f4f7fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 36px 22px 56px; }
      main { max-width: 1120px; margin: 0 auto; }
      header { margin: 0 auto 28px; max-width: 760px; text-align: center; }
      h1 { margin: 0 0 10px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.04em; }
      header p { margin: 0; color: #526174; font-size: 16px; line-height: 1.55; }
      .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
      article { overflow: hidden; min-width: 0; background: #fff; border: 1px solid #d9e2ec; border-radius: 14px; box-shadow: 0 8px 24px #2344660b; }
      .card-head { padding: 18px 20px 12px; border-bottom: 1px solid #edf1f5; }
      h2 { margin: 0 0 4px; font-size: 17px; }
      .caption { margin: 0; color: #65758a; font-size: 13px; }
      .diagram { display: grid; min-height: 280px; place-items: center; padding: 16px; overflow: auto; }
      .diagram svg { display: block; max-width: 100%; height: auto; }
      .source { border-top: 1px solid #edf1f5; }
      summary { padding: 11px 20px; color: #526174; cursor: pointer; font-size: 13px; }
      pre { margin: 0; padding: 0 20px 16px; overflow: auto; color: #334155; font-size: 12px; line-height: 1.55; }
      .status { padding: 18px; color: #a12b2b; font: 13px/1.5 ui-monospace, monospace; }
      footer { margin: 20px 0 0; color: #65758a; text-align: center; font-size: 12px; }
      @media (max-width: 560px) { body { padding: 24px 12px 40px; } .diagram { padding: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>TALA layout for Mermaid</h1>
        <p>An experimental TypeScript layout using TALA’s weighted hierarchy ranker, measured nodes, and orthogonal routes.</p>
      </header>
      <section id="examples" class="grid" aria-live="polite"></section>
      <footer>Rendered in the browser with Mermaid’s external layout loader API.</footer>
    </main>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
