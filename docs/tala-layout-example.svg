<svg xmlns="http://www.w3.org/2000/svg" width="840" height="248" viewBox="0 0 840 248" role="img" aria-labelledby="title desc">
  <title id="title">Mermaid flowchart with the TALA layout</title>
  <desc id="desc">A left-to-right service graph: Web client connects to API gateway, which branches to Catalog and Orders. Catalog connects to Search index and Orders connects to Inventory.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#536b86" />
    </marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b3450" flood-opacity="0.10" />
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .route { fill: none; stroke: #536b86; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .node { fill: #fff; stroke: #b8c9dc; stroke-width: 1.5; filter: url(#shadow); }
      .node-accent { fill: #eef5ff; stroke: #89a9d0; }
      .label { fill: #203149; font-size: 14px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
      .title { fill: #1a2e45; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #64768c; font-size: 12px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="247" rx="16" fill="#f7f9fc" stroke="#e0e7ef" />
  <text class="title" x="28" y="34">TALA-derived Mermaid layout</text>
  <text class="subtitle" x="28" y="54">flowchart LR · measured nodes · layered placement · orthogonal routes</text>

  <g class="route">
    <path d="M170 164 H202 H234" />
    <path d="M388 146.7 H420 V132.3 H452" />
    <path d="M388 181.3 H420 V195.7 H452" />
    <path d="M606 115 H638 H670" />
    <path d="M606 213 H638 H670" />
  </g>

  <g>
    <rect class="node node-accent" x="16" y="137" width="154" height="54" rx="11" />
    <text class="label" x="93" y="164">Web client</text>

    <rect class="node node-accent" x="234" y="137" width="154" height="54" rx="11" />
    <text class="label" x="311" y="164">API gateway</text>

    <rect class="node" x="452" y="88" width="154" height="54" rx="11" />
    <text class="label" x="529" y="115">Catalog</text>

    <rect class="node" x="452" y="186" width="154" height="54" rx="11" />
    <text class="label" x="529" y="213">Orders</text>

    <rect class="node" x="670" y="88" width="154" height="54" rx="11" />
    <text class="label" x="747" y="115">Search index</text>

    <rect class="node" x="670" y="186" width="154" height="54" rx="11" />
    <text class="label" x="747" y="213">Inventory</text>
  </g>
</svg>
